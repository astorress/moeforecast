[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "moeforecast"
dynamic = ["version"]
description = "Mixture-of-Experts time series forecasting with regime clustering and adaptive gating, with a scikit-learn style API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastián Torres", email = "sebastiantorres8800@gmail.com" }]
requires-python = ">=3.10"
keywords = ["forecasting", "time series", "mixture of experts", "clustering", "load forecasting", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
holidays = ["holidays>=0.40"]
lightgbm = ["lightgbm>=4.0"]
all = ["holidays>=0.40", "lightgbm>=4.0"]
dtw = ["tslearn>=0.6.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "holidays>=0.40", "lightgbm>=4.0"]

[project.urls]
Homepage = "https://github.com/astorress/moeforecast"
Issues = "https://github.com/astorress/moeforecast/issues"

[tool.hatch.version]
path = "src/moeforecast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/moeforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
