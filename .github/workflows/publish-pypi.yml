name: PyPI release

on:
  push:
    branches: [master, main]
    paths:
      - "pyproject.toml"
      - "src/moeforecast/**"
      - "README.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    name: Test release candidate
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          pytest -p no:warnings
      - name: Check whether this is a stable release
        id: version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.version import Version
          import re

          source = Path("src/moeforecast/__init__.py").read_text()
          match = re.search(r'__version__ = "([^"]+)"', source)
          if not match:
              raise SystemExit("Could not read moeforecast.__version__")
          version = Version(match.group(1))
          stable = not version.is_prerelease and not version.is_devrelease
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"stable={str(stable).lower()}\n")
          if not stable:
              print(f"{version} is a development/pre-release version; skipping PyPI publication.")
          else:
              print(f"Stable version {version} is eligible for PyPI publication.")
          PY

  publish:
    name: Publish stable package to PyPI
    needs: test
    if: needs.test.outputs.stable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/moeforecast
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
