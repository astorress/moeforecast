name: TestPyPI

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: testpypi-release-branch
  cancel-in-progress: false

jobs:
  test:
    name: Test release branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          pytest -p no:warnings

  publish:
    name: Publish a development build to TestPyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/moeforecast
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set a unique TestPyPI version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("src/moeforecast/__init__.py")
          source = path.read_text()
          match = re.search(r'__version__ = "(\d+\.\d+\.\d+)(?:\.dev\d+)?"', source)
          if not match:
              raise SystemExit("Expected __version__ in X.Y.Z or X.Y.Z.devN format")
          version = f"{match.group(1)}.dev{os.environ['RUN_NUMBER']}"
          path.write_text(re.sub(r'__version__ = "[^"]+"', f'__version__ = "{version}"', source, count=1))
          print(f"Building TestPyPI version {version}")
          PY
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
